{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm p-4">
  <h3 class="mb-3">Welcome to the WHATSUP APP</h3>
  <p>This admin panel helps you manage your WhatsApp AI Bot's FAQ knowledge base.</p>

  <div class="mt-4">
    <a href="{{ url_for('faq.list_faqs') }}" class="btn btn-dark me-2">
      <i class="bi bi-card-list"></i> View FAQs
    </a>
    <a href="{{ url_for('faq.create_faq') }}" class="btn btn-outline-dark">
      <i class="bi bi-plus-circle"></i> Create New FAQ
    </a>
  </div>
</div>
{% endblock %}
